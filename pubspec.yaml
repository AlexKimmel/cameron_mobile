name: cameron_mobile
description: A personal day planner with an on-device assistant.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ^3.14.0
  flutter: '>=3.50.0'

workspace:
  - packages/planner
  - packages/planner_assistant
  - packages/planner_ui

dependencies:
  flutter:
    sdk: flutter
  health: ^13.3.2
  file_picker: ^13.3.3
  flutter_local_notifications: ^22.0.0
  material_ui: ^1.11.0
  path_provider: ^2.1.6
  permission_handler: ^13.0.2
  planner:
  planner_assistant:
  planner_ui:
  shared_preferences: ^2.5.6
  speech_to_text: 7.6.0-beta.4
  speech_to_text_platform_interface: ^2.5.0
  timezone: ^0.11.2
  workmanager: ^0.10.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

hooks:
  user_defines:
    llamadart:
      llamadart_native_runtimes: [llama_cpp]
